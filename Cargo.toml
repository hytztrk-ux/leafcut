[workspace]
resolver = "2"
members = ["crates/leafcut-core", "crates/leafcut-cli", "crates/leafcut-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["The leafcut contributors"]
repository = "https://github.com/hytztrk-ux/leafcut"
homepage = "https://github.com/hytztrk-ux/leafcut"
rust-version = "1.88"
keywords = ["pdf", "merge", "split", "offline", "toolkit"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
leafcut-core = { path = "crates/leafcut-core", version = "0.1.0" }
lopdf = { version = "0.47", default-features = false }
thiserror = "2"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
eframe = { version = "0.37", default-features = false }
egui = "0.37"
rfd = "0.18"
sys-locale = "0.3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
